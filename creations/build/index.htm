<!DOCTYPE html>
<html>
 <head>
  <title>Template Jeu</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="jeu.css"/>
  <script src="Sprite.js"></script>
  <script src="Scene.js"></script>
  <script src="Jeu.js"></script>
  <script src="Pot.js" ></script>
  <script src="Spray.js"></script>
  <script src="SprayEau.js"></script>
  <script src="SprayInsecte.js"></script>
  <script src="Insecte.js"></script>
  <script src="BarreTimer.js"></script>
  <!-- Inclure ici les fichiers JavaScript necessaires a la scene. -->
  <script>
   let scene;

   function load() {
    scene = new Jeu(document.getElementById("scene"));
    scene.start();
    scene.resize();
   }
  </script>
 </head>
 <body onload="load()" onresize="scene.resize()">
  <div id="scene">
   <!-- Definir ici les elements HTML qui seront manipules dans la scene. -->
   <!-- Le code ci-dessous permet affiche un bouton pour le plein ecran -->
   <div id="fullscreen" onmousedown="scene.toggleFullscreen(event);">F</div>

    <div id="timer"></div>

    <div id="feuille">
      <img src="Feuille.png" alt="">
    </div>
    <!-- FeuilleInfo -->
    <div id="feuilles2">
      <img src="FeuilleInfo.png" alt="Infos">
    </div>

   <div class="image-container">
    <div class="row">
        <img src="VisuelPourEau.png" alt="SprayEau">
        <img src="VisuelPourInsecte.png" alt="SprayInsecte">
    </div>
    <div class="row">
        <img id="boutonvisu" src="BoutonSprayInsecte.png" alt="Bouton1">
        <img id="boutonvisu" src="BoutonSprayPlante.png" alt="Bouton2">
    </div>
  </div>
 </body>
</html>
